<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Câu 29 - Return first and last name from a form</title>
</head>
<body>
  <form id="form1" onsubmit="return getFormvalue()">
    First name: <input type="text" name="fname" value="David"><br>
    Last name: <input type="text" name="lname" value="Beckham"><br>
    <input type="submit" value="Submit">
  </form>

  <script>
    function getFormvalue() {
      const form = document.getElementById("form1");
      const firstName = form.elements.namedItem("fname").value;
      const lastName = form.elements.namedItem("lname").value;
      alert(`Họ và tên: ${firstName} ${lastName}`);
      return false;
    }
  </script>
</body>
</html>
