<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Câu 32 - Display a random image</title>
  <style>
    body { margin-top: 30px; }
    #imageContainer { margin-top: 12px; }
  </style>
</head>
<body>
  <div>
    <button id="jsstyle" type="button" onclick="display_random_image()">Show Image</button>
  </div>
  <div id="imageContainer"></div>

  <script>
    function display_random_image() {
      const images = [
        {
          src: "http://farm4.staticflickr.com/3691/11268502654_f28f05966c_m.jpg",
          width: 240,
          height: 160
        },
        {
          src: "http://farm1.staticflickr.com/33/45336904_1aef569b30_n.jpg",
          width: 320,
          height: 195
        },
        {
          src: "http://farm6.staticflickr.com/5211/5384592886_80a512e2c9.jpg",
          width: 500,
          height: 343
        }
      ];
      const image = images[Math.floor(Math.random() * images.length)];
      const imageElement = document.createElement("img");

      imageElement.src = image.src;
      imageElement.width = image.width;
      imageElement.height = image.height;
      imageElement.alt = "Ảnh ngẫu nhiên";

      const imageContainer = document.getElementById("imageContainer");
      imageContainer.replaceChildren(imageElement);
    }
  </script>
</body>
</html>
